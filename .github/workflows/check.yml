name: Offline validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.6
          tofu_wrapper: false
      - name: Install static validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible-core nix-bin shellcheck
      - name: Validate IaC, NixOS evaluation, scripts and mocked policy plans
        run: ./tools/check
      - name: Parse Windows provisioning and smoke scripts
        shell: pwsh
        run: |
          Get-ChildItem windows/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
