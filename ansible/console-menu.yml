---
- name: Install the browser console menu on Linux lab guests
  hosts: office,remote,connector,origin,iot-gateway
  gather_facts: false
  become: true
  ignore_unreachable: true
  tasks:
    - name: Create the menu directory
      ansible.builtin.file:
        path: /etc/cfztna-console
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the lab topology
      ansible.builtin.copy:
        src: ../topology.json
        dest: /etc/cfztna-console/topology.json
        owner: root
        group: root
        mode: "0644"

    - name: Install the Nix-built console binary
      ansible.builtin.copy:
        src: "{{ lookup('ansible.builtin.env', 'CFZTNA_CONSOLE_BINARY') }}"
        dest: /etc/cfztna-console/cfztna-console
        owner: root
        group: root
        mode: "0755"

    - name: Remove the superseded Python menu
      ansible.builtin.file:
        path: /etc/cfztna-console/lab_menu.py
        state: absent
