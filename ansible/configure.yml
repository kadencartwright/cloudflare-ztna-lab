---
- name: Provision the Samba lab account
  hosts: origin
  gather_facts: false
  become: true
  vars:
    smb_password: "{{ lookup('ansible.builtin.file', '../.lab/smb-password') }}"
  tasks:
    - name: Set the isolated Samba share password
      ansible.builtin.command:
        argv: [smbpasswd, -s, -a, labshare]
        stdin: "{{ smb_password }}\n{{ smb_password }}"
      no_log: true
      changed_when: true

    - name: Verify Samba and the IPP emulator are active
      ansible.builtin.command:
        argv: [systemctl, is-active, samba-smbd.service, lab-printer.service]
      changed_when: false

    - name: Wait for both origin service sockets from the connector
      ansible.builtin.wait_for:
        host: "{{ inventory_hostname_ip }}"
        port: "{{ item }}"
        timeout: 30
      vars:
        inventory_hostname_ip: "{{ (lookup('ansible.builtin.file', '../topology.json') | from_json).machines.origin.ip }}"
      loop: [445, 631]
      delegate_to: connector
      become: false

- name: Provision the office desktop account
  hosts: office
  gather_facts: false
  become: true
  vars:
    desktop_password: "{{ lookup('ansible.builtin.file', '../.lab/office-desktop-password') }}"
  tasks:
    - name: Set the local GNOME login password
      ansible.builtin.command:
        argv: [chpasswd]
        stdin: "employee:{{ desktop_password }}"
      no_log: true
      changed_when: true
