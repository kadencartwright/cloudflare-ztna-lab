services:
  guacd:
    image: guacamole/guacd:1.6.0@sha256:8974eaa9ba32f713daf311e7cc8cd7e4cdfba1edea39eed75524e78ef4b08f4f
    network_mode: host
    entrypoint: [/opt/guacamole/sbin/guacd, -f, -b, 127.0.0.1, -l, '24822']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, nc, -z, '127.0.0.1', '24822']
      interval: 3s
      timeout: 2s
      retries: 10

  web:
    image: guacamole/guacamole:1.6.0@sha256:f344085e618bb05e22b964b0208dbd06d3468275bac70206f93805245e067b40
    network_mode: host
    user: ${CFZTNA_CONSOLE_UID:?}:${CFZTNA_CONSOLE_GID:?}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GUACD_HOSTNAME: 127.0.0.1
      GUACD_PORT: '24822'
      GUACAMOLE_HOME: /lab-configuration
    volumes:
      - ../.lab/console/home:/lab-configuration:ro
      - ./tomcat-loopback.sh:/opt/guacamole/entrypoint.d/600-loopback.sh:ro
    depends_on:
      guacd:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, 'http://127.0.0.1:8788/guacamole/']
      interval: 3s
      timeout: 2s
      retries: 20
